<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#skyGrad)"/>
  <!-- Distant mountains -->
  <path d="M0 240 Q180 170 360 220 T720 200 T1080 230 T1200 210 L1200 400 L0 400 Z" fill="#86efac" opacity="0.6"/>
  <path d="M0 260 Q240 210 480 250 T960 230 T1200 250 L1200 400 L0 400 Z" fill="url(#hillGrad)" opacity="0.85"/>
  <!-- Sea water -->
  <path d="M0 280 Q300 270 600 280 T1200 275 L1200 400 L0 400 Z" fill="url(#seaGrad)"/>
  <!-- Beach shore / reef -->
  <path d="M750 310 Q900 290 1050 340 T1200 320 L1200 400 L700 400 Z" fill="#fef08a" opacity="0.7"/>
  <!-- Sun reflections -->
  <circle cx="950" cy="140" r="45" fill="#fef08a" opacity="0.9"/>
</svg>
