<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="47" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Inner Shield -->
  <path d="M50 14 C68 14 78 22 78 44 C78 68 50 84 50 84 C50 84 22 68 22 44 C22 22 32 14 50 14 Z" fill="url(#shieldGrad)" stroke="#facc15" stroke-width="2"/>
