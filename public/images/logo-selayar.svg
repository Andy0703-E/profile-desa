  <path d="M32 62 Q41 58 50 62 T68 62 L67 67 Q59 64 50 67 T33 67 Z" fill="#bae6fd"/>
  <!-- Traditional boat / Phinisi sail -->
  <polygon points="50,38 58,49 50,49" fill="#ffffff"/>
  <polygon points="48,40 42,49 48,49" fill="#ffffff"/>
  <rect x="49" y="37" width="2" height="13" fill="#ca8a04"/>
